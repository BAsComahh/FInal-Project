# 修改后重新启动程序生效。命令行开关优先于这里的设置。
# 窗口里的复选框只影响当前运行，不会改写本文件。
# true = 开启，false = 关闭。
# 几何长度均用短边百分比：5 表示 5%，不是 0.05，也不是 5 像素。

[geometry]
min_line_length_pct = 39.0625        # 最终候选最短线；短边 512 时等于原 200 px
merge_min_length_pct = 3.90625       # 源线段长度；短边 512 时等于原 20 px
merge_distance_pct = 1.171875        # 到拟合线的偏离；短边 512 时等于原 6 px
merge_gap_pct = 9.765625             # 沿拟合线方向的间隙；短边 512 时等于原 50 px
connection_distance_pct = 3.90625    # 端点／交点连接容差；短边 512 时等于原 20 px

[steps]
blur = true              # 高斯模糊；灰度转换始终保留
detection = true         # LSD 检测；关闭后没有候选线段
lsd_refinement = true    # LSD 检测器内部细化
merge = true             # 短线段合并／拟合
repeat_merge = true      # 重复合并直到没有新的可合并目标
length_filter = true     # 拟合完成后筛掉短线，控制进入选边的候选数量
axis_filter = true       # 横／竖方向筛选
border_selection = true  # 各侧区域内直接选最长线段，等长时优先靠近画面边界
search_region = true     # 各侧候选线段的中点只允许进入该侧靠边区域
closure = true           # 严格检查端点连接与四边形闭合
completion = true        # 将最后选出的四条边延长求交，不要求已有接点

[merge_checks]
source_length = false    # 不限制源线段长度，让短边先参与拟合
axis = true              # 源线段接近横／竖方向
angle = true             # 组内线段方向差
distance = true          # 到拟合直线的距离
gap = true               # 沿拟合线方向的空隙
coverage = true          # 原始观测对拟合跨度的覆盖率

[border_selection]
region_pct = 30.0        # 四侧各靠边 30%；上／下按图高，左／右按图宽
