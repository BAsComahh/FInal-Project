<div id="match-ui-sketch" class="viz-carousel" aria-label="Match console layout studies">
  <section data-variant="Side inspector" aria-label="Video with a side inspector">
    <div class="match-stage" data-layout="side"></div>
  </section>
  <section data-variant="Bottom drawer" aria-label="Video with a bottom drawer" hidden>
    <div class="match-stage" data-layout="bottom"></div>
  </section>
</div>
<style>
#match-ui-sketch { color-scheme:light dark; }
#match-ui-sketch .match-stage { min-height:1100px; --paper:light-dark(#f5f7f8,#182126); --surface:light-dark(#ffffff,#222e35); --ink:light-dark(#263d49,#e2edf2); --subtle:light-dark(#546b77,#a8bdc7); --line:light-dark(#ccd8de,#425760); --field:light-dark(#e7edef,#293c45); --accent:light-dark(#276f8c,#80c8df); --team-a:light-dark(#2f7396,#8bc5e3); --team-b:light-dark(#aa5960,#e4a4a7); --warning:light-dark(#90650e,#e5bd67); --panel-size:280px; color:var(--ink); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
#match-ui-sketch .window-label { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 8px; font-family:Bahnschrift,"Segoe UI",sans-serif; font-weight:600; }
#match-ui-sketch .window-label small { font:12px/1.4 "Segoe UI",sans-serif; color:var(--subtle); }
#match-ui-sketch .console, #match-ui-sketch .audience { background:var(--paper); border:1px solid var(--line); border-radius:9px; overflow:hidden; box-sizing:border-box; }
#match-ui-sketch .topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
#match-ui-sketch .brand { font:600 17px/1.3 Bahnschrift,"Segoe UI",sans-serif; }
#match-ui-sketch .small { font-size:12px; color:var(--subtle); }
#match-ui-sketch .mode-switch, #match-ui-sketch .tools, #match-ui-sketch .actions { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
#match-ui-sketch button, #match-ui-sketch select { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:7px 10px; cursor:var(--cursor-interaction,pointer); }
#match-ui-sketch button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:light-dark(#ffffff,#12232c); }
#match-ui-sketch button:disabled { opacity:.45; cursor:default; }
#match-ui-sketch button:focus-visible, #match-ui-sketch select:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
#match-ui-sketch .audience-state { color:var(--accent); font-size:12px; }
#match-ui-sketch .workspace { display:grid; grid-template-columns:minmax(0,1fr) var(--panel-size); height:508px; }
#match-ui-sketch .board-area { display:flex; flex-direction:column; min-width:0; min-height:0; }
#match-ui-sketch .tools { padding:10px 12px; border-bottom:1px solid var(--line); }
#match-ui-sketch .tools button { font-size:12px; }
#match-ui-sketch .board-holder { flex:1; position:relative; min-height:170px; background:var(--field); }
#match-ui-sketch svg.board { display:block; width:100%; height:100%; touch-action:none; }
#match-ui-sketch svg text { font-family:"Segoe UI",sans-serif; fill:var(--ink); font-size:12px; }
#match-ui-sketch .board-strip { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:9px 12px; font-size:12px; border-top:1px solid var(--line); }
#match-ui-sketch .inspector { background:var(--surface); border-left:1px solid var(--line); padding:16px; min-width:0; }
#match-ui-sketch .panel-title { font:600 17px/1.4 Bahnschrift,"Segoe UI",sans-serif; margin:0 0 12px; }
#match-ui-sketch .inspector label { display:grid; gap:5px; margin-bottom:13px; }
#match-ui-sketch .inspector select { width:100%; min-width:0; }
#match-ui-sketch .facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
#match-ui-sketch .facts span { display:block; font-size:12px; color:var(--subtle); }
#match-ui-sketch .facts strong { display:block; font-size:14px; font-weight:500; }
#match-ui-sketch .panel-note { margin:12px 0; color:var(--subtle); font-size:12px; }
#match-ui-sketch .warning { color:var(--warning); }
#match-ui-sketch .footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding:9px 14px; font-size:12px; color:var(--subtle); border-top:1px solid var(--line); }
#match-ui-sketch .mode-label { font:12px/1.4 "Cascadia Code",Consolas,monospace; letter-spacing:.08em; color:var(--accent); }
#match-ui-sketch .audience-label { margin-top:24px; }
#match-ui-sketch .audience { position:relative; width:min(100%,640px); aspect-ratio:16/9; background:var(--field); }
#match-ui-sketch .audience .mode-label { position:absolute; top:12px; left:14px; z-index:1; padding:4px 8px; background:var(--surface); border-radius:4px; }
#match-ui-sketch .audience .board-holder { position:absolute; inset:0; height:100%; }
#match-ui-sketch .bottom .workspace { grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(220px,1fr) auto; }
#match-ui-sketch .bottom .inspector { border-left:0; border-top:1px solid var(--line); display:grid; grid-template-columns:minmax(170px,1fr) minmax(170px,1.2fr); column-gap:24px; min-height:var(--panel-size); padding:12px 16px; }
#match-ui-sketch .bottom .panel-title { margin-bottom:8px; }
#match-ui-sketch .bottom .facts { margin:0 0 10px; }
#match-ui-sketch .bottom .inspector label { margin-bottom:5px; }
#match-ui-sketch .bottom .panel-note { margin:6px 0; }
#match-ui-sketch .selected-ring { stroke:var(--accent); stroke-width:3; fill:none; }
#match-ui-sketch .unit { cursor:var(--cursor-interaction,pointer); }
#match-ui-sketch .status-line { min-height:20px; }
@media(max-width:700px) {
 #match-ui-sketch .match-stage { min-height:1280px; }
 #match-ui-sketch .workspace, #match-ui-sketch .bottom .workspace { display:flex; flex-direction:column; height:auto; }
 #match-ui-sketch .board-holder { height:285px; flex:none; }
 #match-ui-sketch .inspector, #match-ui-sketch .bottom .inspector { display:block; border-left:0; border-top:1px solid var(--line); min-height:290px; }
 #match-ui-sketch .audience .board-holder { height:100%; }
 #match-ui-sketch .topbar { padding:12px; }
 #match-ui-sketch .mode-switch button { flex:1; }
 #match-ui-sketch .mode-switch { width:100%; }
 #match-ui-sketch .bottom .facts { margin-top:10px; }
}
</style>
<script>
(() => {
 const root=document.getElementById('match-ui-sketch');
 const base={ 'A1.1':{x:.23,y:.65,r:0,side:'A',type:'Type 1'}, 'B1.1':{x:.70,y:.30,r:180,side:'B',type:'Type 1'}, 'B2.1':{x:.76,y:.74,r:160,side:'B',type:'Type 2'} };
 const clone=value=>JSON.parse(JSON.stringify(value));
 const sessions=[];
 const initial=window.openai?.widgetState?.privateContent?.designs || {};
 const svgNS='http://www.w3.org/2000/svg';
 function save(active) {
  const designs={};sessions.forEach(s=>designs[s.layout]={mode:s.state.mode,selected:s.state.selected,step:s.state.step,recovered:s.state.recovered,hypo:s.state.hypo});
  window.openai?.setWidgetState?.({modelContent:{lastInteractedDesign:active.layout,mode:active.state.mode,selectedUnit:active.state.selected},privateContent:{designs}})?.catch(()=>{});
 }
 root.querySelectorAll('.match-stage').forEach(stage=>{
  const layout=stage.dataset.layout;
  stage.classList.toggle('bottom',layout==='bottom');stage.style.setProperty('--panel-size',layout==='bottom'?'172px':'280px');
  stage.innerHTML=`<div class="window-label">Operator console <small>Sample match · interaction sketch</small></div>
   <div class="console">
    <div class="topbar"><div><div class="brand">Match workspace</div><div class="small">List A vs List B</div></div>
     <nav class="mode-switch" aria-label="Workspace mode"><button data-mode="Live">Live</button><button data-mode="Replay">Replay</button><button data-mode="What-if">What-if</button></nav>
     <div class="audience-state" aria-live="polite"></div></div>
    <div class="workspace"><div class="board-area"><div class="tools" aria-label="Context tools"></div>
     <div class="board-holder"><svg class="board operator-board" role="img" aria-label="Sample board; select units through the inspector or board"></svg></div>
     <div class="board-strip"><span class="mode-label operator-mode"></span><span class="status-line"></span></div></div>
     <aside class="inspector" aria-label="Context inspector"></aside></div>
    <div class="footer"><span>Live source and tracking continue</span><span>Operator controls stay here</span></div>
   </div>
   <div class="window-label audience-label">Audience window <small>Follows the current workspace mode</small></div>
   <div class="audience"><span class="mode-label audience-mode"></span><div class="board-holder"><svg class="board audience-board" role="img" aria-label="Audience view of the current sample mode"></svg></div></div>`;
  const restored=initial[layout]||{};
  const state={mode:['Live','Replay','What-if'].includes(restored.mode)?restored.mode:'Live',tool:'Select',selected:restored.selected||'A1.1',step:Number.isInteger(restored.step)?Math.max(0,Math.min(5,restored.step)):5,recovered:!!restored.recovered,hypo:restored.hypo||null,undo:[],second:null,candidate:true};
  const session={layout,stage,state};sessions.push(session);
  const q=selector=>stage.querySelector(selector);
  const live=()=>({...clone(base),...(state.recovered?{'A1.2':{x:.44,y:.55,r:25,side:'A',type:'Type 1'}}:{})});
  function poses() {
   if(state.mode==='What-if') {if(!state.hypo)state.hypo=live();return state.hypo;}
   const units=live();
   if(state.mode==='Replay') {delete units['A1.2'];units['A1.1'].x=.13+state.step*.02;units['B1.1'].r=140+state.step*8;}
   return units;
  }
  function panel() {
   const units=poses();if(!units[state.selected])state.selected=Object.keys(units)[0];
   const unit=units[state.selected];
   if(state.tool==='Recover') {
    q('.inspector').innerHTML=`<div><h3 class="panel-title">Tracking recovery</h3><div class="warning">List A · A1.2</div><p class="panel-note">Automatic search needs review.</p><div class="small">List B · No missing units</div></div>
     <div><div class="facts"><div><span>Candidate</span><strong>${state.candidate?'Available':'Rejected'}</strong></div><div><span>Identity</span><strong>Needs confirmation</strong></div></div>
     <div class="actions"><button data-action="correct" ${!state.candidate?'disabled':''}>Correct</button><button data-action="no" ${!state.candidate?'disabled':''}>No</button><button data-action="clear">Cancel</button>${!state.candidate?'<button data-action="sample">Review sample candidate</button>':''}</div></div>`;
    return;
   }
   const options=Object.keys(units).map(id=>`<option value="${id}" ${id===state.selected?'selected':''}>${id}</option>`).join('');
   const details=state.tool==='Select';
   q('.inspector').innerHTML=`<div><h3 class="panel-title">${details?'Unit details':state.tool}</h3><label><span class="small">Selected unit</span><select aria-label="Selected unit">${options}</select></label>
    <p class="panel-note">${state.mode==='What-if'?'Drag a tray, or use the move controls.':details?'Select a tray to inspect this unit.':state.second?'Comparison target: '+state.second:'Select another tray on the board.'}</p></div>
    <div><div class="facts"><div><span>Army / Type</span><strong>${unit.side} / ${unit.type}</strong></div><div><span>Tray (mm)</span><strong>${unit.type==='Type 1'?'155 × 50':'205 × 80'}</strong></div><div><span>Facing</span><strong>Estimated</strong></div><div><span>Damage</span><strong>Not recorded</strong></div></div>
    ${state.mode==='What-if'?'<div class="actions"><button data-action="left">Move left</button><button data-action="right">Move right</button><button data-action="rotate">Rotate</button><button data-action="undo" '+(!state.undo.length?'disabled':'')+'>Undo</button></div>':'<div class="small">'+(details?'Tracking · Active':'Geometry uses the selected sample trays')+'</div>'}</div>`;
  }
  function draw(svg,audience) {
   const box=svg.getBoundingClientRect(),outerWidth=Math.max(280,box.width||640),outerHeight=Math.max(160,box.height||300);
   const w=Math.min(outerWidth-16,(outerHeight-16)*5/3),h=w*3/5,ox=(outerWidth-w)/2,oy=(outerHeight-h)/2;
   svg.setAttribute('viewBox',`0 0 ${outerWidth} ${outerHeight}`);
   svg._drawingBounds={x:ox,y:oy,width:w,height:h};
   const units=poses();
   let markup=`<title>${state.mode} sample board</title><desc>List A and B sample trays and terrain. The audience follows the operator mode without controls.</desc><g transform="translate(${ox} ${oy})">
    <rect x="${w*.04}" y="${h*.08}" width="${w*.92}" height="${h*.84}" rx="5" fill="none" stroke="var(--line)"/>
    <path d="M${w*.38},${h*.18} l${w*.16},${h*.04} l${-w*.03},${h*.21} l${-w*.15},${-h*.03} Z" fill="var(--surface)" stroke="var(--line)"/>
    <ellipse cx="${w*.51}" cy="${h*.77}" rx="${w*.10}" ry="${h*.10}" fill="none" stroke="var(--line)"/>
    <text x="${w*.42}" y="${h*.31}">Terrain</text>`;
   if(state.second && state.tool!=='Select' && state.tool!=='Recover' && units[state.second]) {
    const a=units[state.selected],b=units[state.second];
    markup+=`<line x1="${a.x*w}" y1="${a.y*h}" x2="${b.x*w}" y2="${b.y*h}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
   }
   for(const [id,u] of Object.entries(units)) {
    const width=Math.max(28,w*.09),height=Math.max(12,w*.032);
    markup+=`<g class="unit" data-unit="${id}" transform="translate(${u.x*w} ${u.y*h})"><g transform="rotate(${u.r})">
      <rect x="${-width/2}" y="${-height/2}" width="${width}" height="${height}" rx="2" fill="var(--surface)" stroke="var(--team-${u.side.toLowerCase()})" stroke-width="2"/>
      <line x1="${-width/2+3}" y1="${-height/2+3}" x2="${width/2-3}" y2="${-height/2+3}" stroke="var(--team-${u.side.toLowerCase()})" stroke-width="4"/>
      ${!audience&&id===state.selected?`<rect class="selected-ring" x="${-width/2-4}" y="${-height/2-4}" width="${width+8}" height="${height+8}" rx="3"/>`:''}</g>
      <text x="0" y="-25" text-anchor="middle">${id}</text></g>`;
   }
   if(!audience&&state.tool==='Recover'&&state.candidate)markup+=`<g transform="translate(${w*.44} ${h*.55})"><rect x="-30" y="-13" width="60" height="26" fill="none" stroke="var(--warning)" stroke-width="2" stroke-dasharray="4 3"/><text x="0" y="-23" text-anchor="middle">Candidate</text></g>`;
   svg.innerHTML=markup+'</g>';
  }
  function boards(){draw(q('.operator-board'),false);draw(q('.audience-board'),true);}
  function render() {
   stage.dataset.mode=state.mode;
   stage.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
   q('.audience-state').textContent='Audience · '+state.mode;
   q('.operator-mode').textContent=state.mode.toUpperCase();q('.audience-mode').textContent=state.mode==='What-if'?'WHAT-IF · HYPOTHETICAL':state.mode.toUpperCase();
   const tools=state.mode==='Replay'?`<button data-action="previous" ${state.step===0?'disabled':''}>Previous</button><button data-action="next" ${state.step===5?'disabled':''}>Next</button><button data-action="live">Back to Live</button>`:
    ['Select','Distance','LOS','Move'].map(t=>`<button data-tool="${t}" aria-pressed="${state.tool===t}">${t}</button>`).join('')+(state.mode==='Live'?`<button data-tool="Recover" aria-pressed="${state.tool==='Recover'}" ${state.recovered?'disabled':''}>Recovery ${state.recovered?'0':'1'}</button>`:'<button data-action="live">Back to Live</button>');
   q('.tools').innerHTML=tools;
   q('.status-line').textContent=state.mode==='Replay'?`Step ${state.step} / 5 · ${state.step===0?'Initial registration':state.step%2?'Move A1.1':'Rotate B1.1'}`:state.mode==='What-if'?'Hypothetical layout · Ctrl+Z undoes edits':'Source 24:16 · Observed 24:15.6';
   panel();boards();
  }
  function select(id) {if(state.tool!=='Select'&&state.tool!=='Recover'&&id!==state.selected)state.second=id;else{state.selected=id;state.second=null;}render();save(session);}
  function mutate(action) {state.undo.push(clone(state.hypo));const u=state.hypo[state.selected];if(action==='rotate')u.r=(u.r+45)%360;else u.x=Math.max(.08,Math.min(.92,u.x+(action==='left'?-.04:.04)));}
  stage.addEventListener('click',event=>{
   const mode=event.target.closest('button[data-mode]'),tool=event.target.closest('button[data-tool]'),action=event.target.closest('button[data-action]');
   if(mode){if(state.mode===mode.dataset.mode)return;state.mode=mode.dataset.mode;state.tool='Select';state.second=null;if(state.mode==='Replay')state.step=5;if(state.mode==='What-if'){state.hypo=live();state.undo=[];}}
   else if(tool){state.tool=tool.dataset.tool;state.second=null;}
   else if(action){switch(action.dataset.action){case'previous':state.step=Math.max(0,state.step-1);break;case'next':state.step=Math.min(5,state.step+1);break;case'live':state.mode='Live';state.tool='Select';state.second=null;break;case'clear':state.tool='Select';break;case'correct':state.recovered=true;state.tool='Select';state.selected='A1.2';break;case'no':state.candidate=false;break;case'sample':state.candidate=true;break;case'undo':if(state.undo.length)state.hypo=state.undo.pop();break;default:if(state.mode==='What-if')mutate(action.dataset.action);}}
   else {const unit=event.target.closest('[data-unit]');if(unit&&q('.operator-board').contains(unit)){select(unit.dataset.unit);return;}return;}
   render();save(session);
  });
  stage.addEventListener('change',event=>{if(event.target.matches('.inspector select')){state.selected=event.target.value;state.second=null;render();save(session);}});
  let drag=null;
  q('.operator-board').addEventListener('pointerdown',event=>{
   const unit=event.target.closest('[data-unit]');if(state.mode!=='What-if'||!unit)return;
   state.selected=unit.dataset.unit;state.undo.push(clone(state.hypo));drag={id:state.selected,moved:false};q('.operator-board').setPointerCapture(event.pointerId);panel();
  });
  q('.operator-board').addEventListener('pointermove',event=>{
   if(!drag)return;const b=q('.operator-board').getBoundingClientRect(),p=q('.operator-board')._drawingBounds;const u=state.hypo[drag.id];u.x=Math.max(.08,Math.min(.92,(event.clientX-b.left-p.x)/p.width));u.y=Math.max(.14,Math.min(.86,(event.clientY-b.top-p.y)/p.height));drag.moved=true;boards();
  });
  q('.operator-board').addEventListener('pointerup',()=>{if(drag){if(!drag.moved)state.undo.pop();drag=null;render();save(session);}});
  stage.addEventListener('keydown',event=>{
   if(event.target.matches('select,input,textarea'))return;
   if(state.mode==='Replay'&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&['ArrowLeft','ArrowRight','a','d','A','D'].includes(event.key)){event.preventDefault();state.step=Math.max(0,Math.min(5,state.step+(['ArrowLeft','a','A'].includes(event.key)?-1:1)));render();save(session);}
   if(state.mode==='What-if'&&event.ctrlKey&&event.key.toLowerCase()==='z'){event.preventDefault();if(state.undo.length)state.hypo=state.undo.pop();render();save(session);}
  });
  render();new ResizeObserver(boards).observe(q('.workspace'));
  if(globalThis.Tweak){const controls={panel:layout==='side'?280:172};const tweak=new Tweak({container:q('.console'),onChange:()=>{stage.style.setProperty('--panel-size',controls.panel+'px');boards();}});tweak.addSlider(controls,'panel',{label:layout==='side'?'Inspector width':'Drawer height',min:layout==='side'?230:150,max:layout==='side'?340:220,unit:'px'});}
  session.render=render;
 });
 window.addEventListener('openai:set_globals',event=>{
  const saved=event.detail?.globals?.widgetState?.privateContent?.designs;if(!saved)return;
  sessions.forEach(s=>{const value=saved[s.layout];if(!value)return;if(['Live','Replay','What-if'].includes(value.mode))s.state.mode=value.mode;if(Number.isInteger(value.step))s.state.step=Math.max(0,Math.min(5,value.step));s.state.recovered=!!value.recovered;if(typeof value.selected==='string')s.state.selected=value.selected;if(value.hypo)s.state.hypo=value.hypo;s.render();});
 });
})();
</script>
